# ---------------------------------------------------------------------------
# nginx main configuration.
#
# Virtual hosts live in config/nginx/conf.d/*.conf.template and are rendered
# by the image's envsubst pass at container start.
#
# Unlike the Odoo project in this portfolio, nginx here is not purely a
# reverse proxy: it serves Nextcloud's static assets directly from the shared
# volume and speaks FastCGI to PHP-FPM for everything else. The web UI is
# thousands of small files, and routing those through PHP would waste a worker
# per icon.
# ---------------------------------------------------------------------------

user  nginx;
worker_processes  auto;

# Each proxied connection costs two descriptors. Nextcloud clients (desktop
# sync, mobile) hold many long-lived connections, so the 1024 default is
# reached early and presents as "24: Too many open files".
worker_rlimit_nofile 65535;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  4096;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # --- Logging -----------------------------------------------------------
    # JSON, parsed by Promtail into queryable fields at ingest.
    # upstream_response_time is time waiting on PHP-FPM; request_time is total.
    # When they diverge the delay is the network or a slow client, not the
    # application -- the first thing worth knowing during a latency complaint.
    log_format json_combined escape=json
        '{'
        '"time":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"request_method":"$request_method",'
        '"request_uri":"$request_uri",'
        '"status":$status,'
        '"body_bytes_sent":$body_bytes_sent,'
        '"request_length":$request_length,'
        '"request_time":$request_time,'
        '"upstream_response_time":"$upstream_response_time",'
        '"upstream_status":"$upstream_status",'
        '"http_user_agent":"$http_user_agent",'
        '"request_id":"$request_id"'
        '}';

    access_log  /var/log/nginx/access.log  json_combined;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # --- Upload ceiling ----------------------------------------------------
    # client_max_body_size is deliberately NOT set here.
    #
    # The nginx image's envsubst pass processes only /etc/nginx/templates.
    # This file is mounted directly at /etc/nginx/nginx.conf, so a
    # ${PHP_UPLOAD_LIMIT} placeholder would reach nginx literally and the
    # server would refuse to start with:
    #
    #   [emerg] "client_max_body_size" directive invalid value
    #
    # The limit is therefore set in the vhost template, which IS rendered.
    # The internal status listener below keeps nginx's 1 MB default, which is
    # correct -- it accepts no uploads.

    # Do NOT buffer request bodies to disk before forwarding. On a 10 GB
    # upload that would mean writing 10 GB to the container filesystem first.
    client_body_buffer_size 512k;
    client_body_timeout 300s;
    client_header_timeout 60s;

    # --- Compression -------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_comp_level 4;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types
        application/atom+xml application/javascript application/json
        application/ld+json application/manifest+json application/rss+xml
        application/vnd.geo+json application/vnd.ms-fontobject
        application/wasm application/x-font-ttf application/x-web-app-manifest+json
        application/xhtml+xml application/xml font/opentype
        image/bmp image/svg+xml image/x-icon
        text/cache-manifest text/css text/plain text/vcard
        text/vnd.rim.location.xloc text/vtt text/x-component text/x-cross-domain-policy;

    # --- FastCGI upstream --------------------------------------------------
    upstream php-handler {
        server app:9000 max_fails=3 fail_timeout=30s;
        # Connection reuse to FPM. Without it every request pays a fresh TCP
        # handshake to the pool.
        keepalive 32;
    }

    # --- Rate limiting -----------------------------------------------------
    # The login endpoint is the credential-stuffing target: it is the only
    # unauthenticated route doing expensive work (an Argon2id verification per
    # attempt), which makes it a cheap CPU-exhaustion vector too.
    #
    # The limit is keyed through a map rather than applied in its own
    # `location` block, and that is not a style choice. An earlier version
    # used `location = /index.php/login`, which matched AFTER the try_files
    # rewrite and bypassed fastcgi_split_path_info -- so SCRIPT_NAME became
    # /index.php/login while REQUEST_URI stayed /login, and Nextcloud rejected
    # every login with:
    #
    #   The requested uri(/login) cannot be processed by the script
    #   '/index.php/login'
    #
    # A map sets the limit key without touching location routing. An empty key
    # means limit_req ignores the request entirely, so only login requests are
    # counted and everything else passes through the generic PHP handler
    # exactly as Nextcloud expects.
    map $request_uri $nc_login_key {
        default              "";
        ~^/login             $binary_remote_addr;
        ~^/index\.php/login  $binary_remote_addr;
    }

    limit_req_zone $nc_login_key      zone=nc_login:10m   rate=10r/m;
    limit_req_zone $binary_remote_addr zone=nc_general:10m rate=120r/s;
    limit_conn_zone $binary_remote_addr zone=nc_conn:10m;

    # --- TLS ---------------------------------------------------------------
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:20m;
    ssl_session_timeout 1d;
    # Without key rotation, session tickets undermine forward secrecy, and
    # nginx has no built-in rotation.
    ssl_session_tickets off;

    # --- Internal status ---------------------------------------------------
    # Probed by the container healthcheck and scraped by the nginx exporter.
    # Kept off the public vhost so neither depends on TLS material or on PHP.
    server {
        listen 8081;
        access_log off;

        location /stub_status {
            stub_status;
            allow 127.0.0.1;
            allow 172.16.0.0/12;
            deny all;
        }

        # PHP-FPM's own status page, reached through FastCGI. This is what
        # answers "are all workers busy" -- the question the container
        # healthcheck cannot, because it only proves the listener is open.
        location ~ ^/(fpm-status|fpm-ping)$ {
            allow 127.0.0.1;
            allow 172.16.0.0/12;
            deny all;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $fastcgi_script_name;
            fastcgi_pass php-handler;
        }

        location / { return 404; }
    }

    include /etc/nginx/conf.d/*.conf;
}

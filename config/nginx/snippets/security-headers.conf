# ---------------------------------------------------------------------------
# Response security headers.
#
# `always` on every header is not decoration: without it nginx omits the
# header on 4xx and 5xx responses, which is precisely when an error page might
# reflect attacker-controlled content.
#
# Nextcloud sets several of these itself. nginx's add_header APPENDS rather
# than replaces, so without fastcgi_hide_header the response carries each
# header twice -- and where two values disagree, browsers do not resolve them
# consistently and the weaker value can win. A smoke test asserts each appears
# exactly once.
# ---------------------------------------------------------------------------

fastcgi_hide_header X-Content-Type-Options;
fastcgi_hide_header X-Frame-Options;
fastcgi_hide_header X-XSS-Protection;
fastcgi_hide_header Referrer-Policy;
fastcgi_hide_header X-Robots-Tag;
fastcgi_hide_header X-Permitted-Cross-Domain-Policies;
fastcgi_hide_header Strict-Transport-Security;

# HSTS. Two years, subdomains included. Deliberately NOT preloaded: preload
# submission is effectively irreversible for the apex domain and everything
# under it, and that is a decision for whoever owns the domain rather than for
# a deployment template.
#
# Note the interaction with certificate problems: a browser that has seen this
# header will not let a user click through a certificate warning. That is HSTS
# working correctly, and it means "swap in a self-signed certificate as a
# stopgap" does not work for returning visitors.
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

# Nextcloud has no legitimate reason to be framed, and clickjacking a file
# store means tricking a user into sharing a document.
add_header X-Frame-Options "SAMEORIGIN" always;

# Stops content-type sniffing. Directly relevant here: Nextcloud serves
# user-uploaded files, and without this a file typed text/plain can be
# executed as script by a browser that decides it knows better.
add_header X-Content-Type-Options "nosniff" always;

# Send the origin but not the path to third parties. Nextcloud URLs contain
# share tokens.
add_header Referrer-Policy "no-referrer" always;

# Keep a private instance out of search indexes. Share links are
# unauthenticated by design; indexing them makes them findable.
add_header X-Robots-Tag "noindex, nofollow" always;

add_header X-Permitted-Cross-Domain-Policies "none" always;

add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

# Deliberately absent: a full Content-Security-Policy with script-src.
#
# Nextcloud ships its OWN CSP, generated per-request by its
# ContentSecurityPolicyManager, and apps extend it at runtime. A static policy
# added here would either be weaker than Nextcloud's (achieving nothing) or
# conflict with it and break the web UI. This is the opposite situation to the
# Odoo project in this portfolio, where no useful CSP is possible at all --
# here a good one already exists and the correct action is to not interfere.
#
# Tracked in docs/adr/007-tls-and-http-security.md.

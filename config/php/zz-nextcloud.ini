; ---------------------------------------------------------------------------
; PHP runtime overrides for Nextcloud.
;
; Loaded after the image's own nextcloud.ini (the `zz-` prefix), so anything
; here wins.
;
; DELIBERATELY ABSENT: memory_limit, upload_max_filesize and post_max_size.
; The upstream image already sets all three from PHP_MEMORY_LIMIT and
; PHP_UPLOAD_LIMIT -- PHP's ini parser expands ${ENV_VAR}, which is how it
; does it. Restating them here would duplicate upstream behaviour and create
; two places to change one number.
;
; The upload ceiling appears in three places and they must agree:
;
;   nginx  client_max_body_size   rejects early with a 413
;   PHP    upload_max_filesize    rejects after the body has transferred
;   PHP    post_max_size          must be >= upload_max_filesize
;
; nginx is set from the same PHP_UPLOAD_LIMIT variable, never below it. If PHP
; were the smaller, a 10 GB upload would transfer completely and only then be
; rejected -- which over a domestic connection is a genuinely bad afternoon.
; ---------------------------------------------------------------------------

; Large uploads and preview generation are legitimately slow. Unbounded is
; wrong, but the 30s default aborts a perfectly normal chunked upload.
max_input_time = 3600
max_execution_time = 3600
max_file_uploads = 100

; Nextcloud buffers uploads here before moving them into place, so this needs
; free space comparable to the largest upload in flight.
upload_tmp_dir = /tmp

; --- Output ----------------------------------------------------------------
; Never render errors into a response. A PHP notice in an HTTP response leaks
; absolute paths and sometimes credentials from a stack trace.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /proc/self/fd/2
error_reporting = E_ALL & ~E_DEPRECATED

; Do not advertise the PHP version in X-Powered-By.
expose_php = Off

; --- Sessions --------------------------------------------------------------
session.cookie_httponly = On
session.cookie_secure = On
session.cookie_samesite = "Lax"
session.use_strict_mode = On

; --- Misc ------------------------------------------------------------------
; Unset, PHP warns on every date operation and log timestamps are ambiguous.
date.timezone = UTC

; Nextcloud's file listings and share dialogs generate large POST bodies.
max_input_vars = 5000

; APCu must be available to the CLI too, or occ and cron.php run without a
; local cache and Nextcloud's admin overview reports it as misconfigured.
apc.enable_cli = 1

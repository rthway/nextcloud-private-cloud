; ---------------------------------------------------------------------------
; OPcache overrides.
;
; The upstream image already ships opcache-recommended.ini with sensible
; values. This file exists only to change what genuinely needs changing, and
; the `zz-` prefix makes it load last so it wins.
;
; Deliberately NOT overridden: opcache.jit. Upstream enables it (jit=1255,
; 8 MB buffer) and Nextcloud ships that setting themselves. Turning it off
; because JIT has historically had bugs would be second-guessing the people
; who benchmark this application, on no evidence of my own.
; ---------------------------------------------------------------------------

; Upstream sets 10000. Nextcloud's core is already close to that before any
; apps are installed; past the limit, files are simply never cached and the
; symptom is one part of the UI being persistently slower than the rest with
; no obvious cause. Nextcloud's own documentation recommends raising it.
opcache.max_accelerated_files = 20000

; Enable OPcache for the CLI SAPI as well. occ and cron.php run through it,
; and cron.php runs every five minutes -- recompiling Nextcloud each time is
; pure waste.
opcache.enable_cli = 1

; Revalidate timestamps rather than trusting the cache indefinitely. An
; upgrade replaces files on disk; a cache that never revalidates keeps serving
; old code, which during an upgrade means new database migrations running
; against old PHP.
opcache.validate_timestamps = 1
opcache.revalidate_freq = 60

; Reclaim memory once 10% is wasted instead of waiting for a full restart.
opcache.max_wasted_percentage = 10

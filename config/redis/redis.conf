# ---------------------------------------------------------------------------
# Redis for Nextcloud.
#
# Two jobs, and they have opposite requirements -- which is the interesting
# part of this configuration:
#
#   1. CACHE           losable. Evicting an entry costs a cache miss.
#   2. FILE LOCKING    NOT losable. Losing a lock lets two processes write the
#                      same file, and losing the whole keyspace can leave
#                      files permanently marked locked.
#
# A pure cache would use `maxmemory-policy allkeys-lru` and no persistence. A
# pure lock store would use `noeviction` and durable persistence. Nextcloud
# uses one Redis for both, so the configuration favours the lock role: locks
# are never evicted, and the keyspace survives a restart.
#
# The password is passed on the command line in compose.yml rather than set
# here, so this file can stay in version control without a credential in it.
# ---------------------------------------------------------------------------

bind 0.0.0.0
port 6379
protected-mode yes

# --- Memory ----------------------------------------------------------------
# Below the 512 MB container limit, so Redis manages its own pressure rather
# than being OOM-killed. A killed Redis loses every lock at once.
maxmemory 384mb

# volatile-lru, NOT allkeys-lru.
#
# This is the load-bearing line. allkeys-lru evicts any key under pressure --
# including file locks, which have no TTL. Evicting a lock lets a second
# process write a file another is already writing. volatile-lru only evicts
# keys that have an expiry set, which means cache entries and never locks.
#
# The trade: if memory fills with non-expiring keys, writes fail with OOM
# instead of silently evicting. That is the correct failure -- a loud error
# beats silent corruption.
maxmemory-policy volatile-lru
maxmemory-samples 5

# --- Persistence -----------------------------------------------------------
# AOF, because locks must survive a restart. Without persistence, a Redis
# restart drops every lock; Nextcloud then has files whose lock rows in the
# database no longer match Redis, which surfaces as files that cannot be
# edited until `occ maintenance:repair` clears them.
appendonly yes
appendfilename "nextcloud.aof"
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# RDB snapshots as well, as a cheap second copy that is far faster to load.
save 900 1
save 300 10
save 60 10000
rdbcompression yes
rdbchecksum yes
dbfilename nextcloud.rdb
dir /data

# --- Clients ---------------------------------------------------------------
# Well above the PHP-FPM worker count: each worker may hold a connection, and
# cron adds more.
maxclients 512

# Close idle connections after five minutes. PHP-FPM workers are recycled
# after pm.max_requests, and their Redis connections would otherwise linger.
timeout 300
tcp-keepalive 300

# --- Safety ----------------------------------------------------------------
# Rename the commands that can destroy state. An application bug or an
# injection that reaches Redis should not be able to flush every lock.
# Nextcloud never issues any of these.
rename-command FLUSHDB ""
rename-command FLUSHALL ""
rename-command KEYS ""
rename-command CONFIG ""
rename-command SHUTDOWN ""

# --- Logging ---------------------------------------------------------------
logfile ""
loglevel notice

# Log commands slower than 10ms. Redis operations are microseconds; anything
# in this log is a real problem, usually a large keyspace scan.
slowlog-log-slower-than 10000
slowlog-max-len 128

# --- Latency ---------------------------------------------------------------
# Disable transparent hugepage warnings being fatal; the host setting is what
# matters and is documented in the Ansible/host notes rather than fought here.
latency-monitor-threshold 100

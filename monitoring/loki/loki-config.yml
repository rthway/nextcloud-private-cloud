# ---------------------------------------------------------------------------
# Loki -- single-binary mode, filesystem storage.
#
# Appropriate for one host. It is explicitly NOT a scalable logging tier: the
# filesystem backend has no replication and no object storage, so the logs
# live and die with this volume. That is an accepted trade for a
# single-node deployment where logs are a debugging aid rather than an audit
# record; SCALING.md sets out what changes when that stops being true.
# ---------------------------------------------------------------------------

auth_enabled: false   # single tenant; Loki is not exposed outside the compose network

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-04-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  # Nextcloud logs a burst during an upgrade as each app is checked; the
  # default ingestion limit rejects part of it, which loses exactly the lines
  # needed to diagnose a failed app migration.
  ingestion_rate_mb: 8
  ingestion_burst_size_mb: 16

  # Container clocks and Docker's own buffering mean lines can arrive
  # slightly out of order. Rejecting them outright loses log lines for no
  # good reason.
  reject_old_samples: true
  reject_old_samples_max_age: 168h

  max_query_series: 5000
  max_query_lookback: 720h

  # Retention. 31 days on a single node, deliberately shorter than
  # Prometheus's metric retention because log volume per day is far larger.
  retention_period: 744h

  # Guards against a runaway label -- a stack trace accidentally promoted to
  # a label value would otherwise explode the index.
  max_label_names_per_series: 20
  max_label_value_length: 2048

compactor:
  working_directory: /loki/compactor
  # Without delete_request_store set, retention_enabled has no effect and
  # logs accumulate until the volume fills.
  retention_enabled: true
  delete_request_store: filesystem
  compaction_interval: 10m
  retention_delete_delay: 2h

analytics:
  reporting_enabled: false
